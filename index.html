const T = s => (S.lang === 'bn' && bn[s]) || s;
const orig = new WeakMap();
function applyLang() {
  document.documentElement.lang = S.lang;
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT); let n;
  while (n = w.nextNode()) {
    if (n.parentElement.closest('script,style')) continue;
    const raw = n.nodeValue.trim(); if (!raw) continue;
    let r = orig.get(n);
    if (!r || raw !== r.shown) { r = { o: raw, shown: raw }; orig.set(n, r); }
    const want = S.lang === 'bn' && bn[r.o] ? bn[r.o] : r.o;
    if (want !== r.shown) { n.nodeValue = n.nodeValue.replace(raw, want); r.shown = want; }
  }
  document.querySelectorAll('[placeholder]').forEach(i => { i.dataset.ph ||= i.placeholder; i.placeholder = T(i.dataset.ph); });
}

let unsubUser = null, unsubOrd = null, unsubTx = null, unsubRef = null, signup = false;
const REF_RATE = 0.02;
onAuthStateChanged(auth, u => {
  S.user = u; unsubUser && unsubUser(); unsubOrd && unsubOrd(); unsubTx && unsubTx(); unsubRef && unsubRef(); S.orders = []; S.tx = []; S.refs = []; S.profile = {};
  if (u) unsubUser = onSnapshot(doc(db, 'users', u.uid), s => { S.bal = s.data()?.balance || 0; S.profile = s.data() || {}; head(); if (SETV[S.view]) render(); }, () => {});
  else S.bal = 0;
  if (u) unsubOrd = onSnapshot(query(collection(db, 'orders'), where('uid', '==', u.uid)), s => {
    S.orders = s.docs.map(d => ({ id: d.id, ...d.data() })); if (S.view === 'orders' || SETV[S.view]) render();
  }, () => {});
  if (u) unsubTx = onSnapshot(query(collection(db, 'transactions'), where('uid', '==', u.uid)), s => {
    S.tx = s.docs.map(d => ({ id: d.id, ...d.data() })); if (SETV[S.view]) render();
  }, () => {});
  if (u) unsubRef = onSnapshot(query(collection(db, 'referrals'), where('referrerUid', '==', u.uid)), s => {
    S.refs = s.docs.map(d => ({ id: d.id, ...d.data() })); if (S.view === 'refer') render();
  }, () => {});
  if (S.view === 'orders') render();
  head();
});
function head() {
  $('#who').textContent = S.user ? `${S.user.displayName || S.user.email} · Balance ${money(S.bal)}` : 'Guest';

  applyLang();
}
function authUI() {
  $('#aTitle').textContent = signup ? 'Create account' : 'Login';
  $('#aGo').textContent = signup ? 'Sign up' : 'Login';
  $('#aName').style.display = signup ? 'block' : 'none';
  $('#aRef').style.display = signup ? 'block' : 'none';
  $('#aSwap').textContent = signup ? 'Have an account? Login' : 'New here? Create an account';
}
const genCode = async () => {
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  for (let i = 0; i < 5; i++) {
    let c = 'REF'; for (let j = 0; j < 6; j++) c += A[Math.floor(Math.random() * A.length)];
    try { if (!(await getDoc(doc(db, 'referralCodes', c))).exists()) return c; } catch { return c; }
  }
  return 'REF' + Date.now().toString(36).toUpperCase().slice(-6);
};
const findRef = async code => { try { const d = await getDoc(doc(db, 'referralCodes', code)); return d.exists() ? d.data().uid : null; } catch { return undefined; } };
let refBusy = false;
async function ensureRefCode() {
  if (!S.user || S.profile.refCode || refBusy) return;
  refBusy = true;
  try {
    const code = await genCode();
    await setDoc(doc(db, 'users', S.user.uid), { refCode: code }, { merge: true });
    await setDoc(doc(db, 'referralCodes', code), { uid: S.user.uid });
  } catch {}
  refBusy = false;
}
const openAuth = () => { authUI(); $('#authModal').classList.add('on'); };
$('#aClose').onclick = () => $('#authModal').classList.remove('on');
$('#aSwap').onclick = () => { signup = !signup; authUI(); };
$('#aGo').onclick = async () => {
  const email = $('#aEmail').value.trim(), pass = $('#aPass').value, name = $('#aName').value.trim();
  if (!email || pass.length < 6) return toast('Enter a valid email and a 6+ character password');
  try {
    if (signup) {
      const rc = $('#aRef').value.trim().toUpperCase();
      let refUid = null;
      if (rc) { refUid = await findRef(rc); if (refUid === null) return toast('Invalid referral code'); }
      const c = await createUserWithEmailAndPassword(auth, email, pass);
      if (name) await updateProfile(c.user, { displayName: name });
      if (rc && refUid === undefined) refUid = await findRef(rc);
      const code = await genCode();
      await setDoc(doc(db, 'users', c.user.uid), { name: name || '', email, balance: 0, createdAt: serverTimestamp(), refCode: code, ...(refUid && refUid !== c.user.uid ? { referredBy: refUid } : {}) });
      try {
        await setDoc(doc(db, 'referralCodes', code), { uid: c.user.uid });
        if (refUid && refUid !== c.user.uid) await setDoc(doc(db, 'referrals', c.user.uid), { referrerUid: refUid, name: name || email.split('@')[0], spent: 0, commission: 0, orders: 0, createdAt: serverTimestamp() });
      } catch {}
      $('#aRef').value = '';
      $('#authModal').classList.remove('on'); toast(rc && !refUid ? 'Account created, but the referral code was invalid' : 'Welcome!');
      return;
    } else await signInWithEmailAndPassword(auth, email, pass);
    $('#authModal').classList.remove('on'); toast('Welcome!');
  } catch (e) { toast(e.code ? e.code.replace('auth/', '').replace(/-/g, ' ') : 'Something went wrong'); }
};
$('#authItem').onclick = async () => { closeDrawer(); if (S.user) { await signOut(auth); toast('Logged out'); } else openAuth(); };

async function buy(items) {
  if (!S.user) { toast('Please login to buy'); return openAuth(); }
  const lines = items.map(([id, q]) => ({ p: byId(id), q })).filter(l => l.p);
  const total = lines.reduce((s, l) => s + l.p.price * l.q, 0);
  if (!total) return;
  try {
    await runTransaction(db, async tx => {
      const ref = doc(db, 'users', S.user.uid), snap = await tx.get(ref);
      const rRef = doc(db, 'referrals', S.user.uid), rSnap = await tx.get(rRef);
      const rUid = rSnap.exists() ? rSnap.data().referrerUid : null;
      const rUserRef = rUid ? doc(db, 'users', rUid) : null;
      const rUserSnap = rUserRef ? await tx.get(rUserRef) : null;
      const bal = snap.exists() ? (snap.data().balance || 0) : 0;
      if (bal < total) throw new Error('LOW');
      tx.set(ref, { balance: bal - total }, { merge: true });
      const first = lines[0];
      const orderRef = doc(collection(db, 'orders'));
      tx.set(doc(collection(db, 'recentOrders')), { orderId: orderRef.id, uid: S.user.uid, status: 'Completed', name: S.profile.name || S.user.displayName || (S.user.email || 'User').split('@')[0],
        item: (first.p.name + (first.q > 1 ? ' ×' + first.q : '')) + (lines.length > 1 ? ' +' + (lines.length - 1) + ' more' : ''), total, createdAt: serverTimestamp() });
      const bonus = Math.round(total * REF_RATE * 100) / 100;
      if (rUserRef && bonus > 0) {
        const r = rSnap.data();
        tx.set(rUserRef, { balance: (rUserSnap.exists() ? (rUserSnap.data().balance || 0) : 0) + bonus }, { merge: true });
        tx.set(doc(collection(db, 'transactions')), { uid: rUid, amount: bonus, type: 'referral', from: S.user.uid, createdAt: serverTimestamp() });
        tx.set(rRef, { spent: (r.spent || 0) + total, commission: (r.commission || 0) + bonus, orders: (r.orders || 0) + 1 }, { merge: true });
      }
      tx.set(orderRef, { uid: S.user.uid, email: S.user.email, userName: S.profile.name || S.user.displayName || (S.user.email || 'User').split('@')[0], total, createdAt: serverTimestamp(), status: 'Completed',
        items: lines.map(l => ({ id: l.p.id, name: l.p.name, price: l.p.price, qty: l.q, downloadUrl: l.p.downloadUrl || '' })) });
    });
    items.forEach(([id]) => delete S.cart[id]); save();
    toast('Purchase successful! ' + money(total) + ' deducted'); render();
  } catch (e) { toast(e.message === 'LOW' ? 'Insufficient balance' : 'Purchase failed. Try again'); }
}

function compressImg(file, max) {
  return new Promise((res, rej) => {
    const r = new FileReader(); r.onerror = rej;
    r.onload = () => { const im = new Image(); im.onerror = rej; im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .8));
    }; im.src = r.result; };
    r.readAsDataURL(file);
  });
}

function initSlider() {
  clearInterval(S.timer);
  const box = $('#slider'), t = $('#track'); if (!box || !t || S.banners.length < 2) return;
  const n = S.banners.length, DELAY = 3000;
  S.sl = 0;
  const dots = () => document.querySelectorAll('#dots i').forEach((d, i) => d.classList.toggle('on', i === S.sl));
  const go = (i, anim = true) => {
    S.sl = (i + n) % n;
    t.style.transition = anim ? 'transform .5s ease-out' : 'none';
    t.style.transform = `translateX(-${S.sl * 100}%)`;
    dots();
  };
  const reset = () => { clearInterval(S.timer); S.timer = setInterval(() => go(S.sl + 1), DELAY); };
  $('#sPrev').onclick = () => { go(S.sl - 1); reset(); };
  $('#sNext').onclick = () => { go(S.sl + 1); reset(); };
  $('#dots').onclick = e => { const i = e.target.dataset && e.target.dataset.i; if (i !== undefined) { go(parseInt(i)); reset(); } };

  // swipe / drag (touch + mouse)
  let sx = 0, sy = 0, dx = 0, drag = false, lock = false;
  box.addEventListener('pointerdown', e => {
    if (e.target.closest('.sb')) return;
    drag = true; lock = false; dx = 0; sx = e.clientX; sy = e.clientY;
    clearInterval(S.timer); t.style.transition = 'none';
  });
  box.addEventListener('pointermove', e => {
    if (!drag) return;
    dx = e.clientX - sx; const dy = e.clientY - sy;
    if (!lock && Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 8) { drag = false; go(S.sl); reset(); return; }
    if (!lock && Math.abs(dx) > 5) { lock = true; try { box.setPointerCapture(e.pointerId); } catch (_) {} }
    if (lock) t.style.transform = `translateX(calc(-${S.sl * 100}% + ${dx}px))`;
  });
  const end = () => {
    if (!drag) return; drag = false;
    const th = box.offsetWidth * 0.2;
    if (lock && dx < -th) go(S.sl + 1); else if (lock && dx > th) go(S.sl - 1); else go(S.sl);
    reset();
  };
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', end);
  box.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') end(); });
  box.addEventListener('dragstart', e => e.preventDefault());
  reset();
}

  else if (t.dataset.act) act(t.dataset.act);
  else if (t.dataset.am) amAct(t.dataset.am, t);
  else if (t.dataset.go) { closeDrawer(); if (!goBackTo(t.dataset.go)) nav(t.dataset.go); }
  else if (t.dataset.link) { closeDrawer(); window.open(t.dataset.link, '_blank', 'noopener'); }
  else if (t.hasAttribute('data-soon')) { closeDrawer(); toast('Coming Soon'); }
  else if (t.dataset.c) { S.cat = t.dataset.c; render(); }
  else if (t.dataset.w) toggleWish(t.dataset.w);
  else if (t.dataset.d) nav('detail', t.dataset.d);
  else if (t.dataset.bp) { if (byId(t.dataset.bp)) nav('detail', t.dataset.bp); }
  else if (t.dataset.a) addCart(t.dataset.a);
  else if (t.dataset.b) buy([[t.dataset.b, 1]]);
  else if (t.dataset.q) { const id = t.dataset.q; S.cart[id] = Math.max(0, (S.cart[id] || 0) + +t.dataset.n); if (!S.cart[id]) delete S.cart[id]; save(); render(); }
  else if (t.dataset.rm) { delete S.cart[t.dataset.rm]; save(); render(); }
  else if (t.id === 'buyAll') buy(Object.entries(S.cart));
  else if (t.id === 'back') { if (!goBackTo(S.prev)) nav(S.prev); }
});
async function act(a) {
  try {
    if (a === 'photo') $('#photoIn').click();
    else if (a === 'rename') {
      const n = prompt('Name', S.profile.name || S.user.displayName || '');
      if (n && n.trim()) { await updateProfile(auth.currentUser, { displayName: n.trim() }); await setDoc(doc(db, 'users', S.user.uid), { name: n.trim() }, { merge: true }); }
    }
    else if (a === 'recent') refreshRecent();
    else if (a === 'chpw') { ['#pwOld', '#pwNew', '#pwNew2'].forEach(i => $(i).value = ''); $('#pwModal').classList.add('on'); }
    else if (a === 'copyref' || a === 'shareref') {
      const code = S.profile.refCode; if (!code) return;
      const txt = `Join DG KINBO with my referral code ${code} and get started! ${location.href.split('#')[0]}`;
      if (a === 'shareref' && navigator.share) { try { await navigator.share({ title: 'DG KINBO', text: txt }); } catch {} return; }
      try { await navigator.clipboard.writeText(a === 'copyref' ? code : txt); }
      catch { const t = document.createElement('textarea'); t.value = a === 'copyref' ? code : txt; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
      toast(a === 'copyref' ? 'Code copied' : 'Link copied');
    }
    else if (a === 'pwreset') { await sendPasswordResetEmail(auth, S.user.email); toast('Password reset email sent'); }
    else if (a === 'logout') { await signOut(auth); nav('settings'); toast('Logged out'); }
    else if (a === 'clearcart') { if (confirm(T('Clear Cart') + '?')) { S.cart = {}; save(); render(); toast('Cart cleared'); } }
    else if (a === 'clearwish') { if (confirm(T('Clear Wishlist') + '?')) { S.wish = []; save(); render(); toast('Wishlist cleared'); } }
    else if (a === 'clearall') {
      if (confirm(T('Clear Local Data') + '?')) {
        S.cart = {}; S.wish = []; S.theme = 'system'; S.lang = 'en';
        ['ds_wish', 'ds_cart', 'ds_theme', 'ds_lang'].forEach(k => localStorage.removeItem(k));
        applyTheme(); render(); toast('Local data cleared');
      }
    }
  } catch (e) { toast('Something went wrong'); }
}
$('#pwClose').onclick = () => $('#pwModal').classList.remove('on');
$('#pwGo').onclick = async () => {
  const o = $('#pwOld').value, n = $('#pwNew').value, n2 = $('#pwNew2').value;
  if (!o || !n || !n2) return toast('Fill in all fields');
  if (n.length < 6) return toast('Password must be at least 6 characters');
  if (n !== n2) return toast('Passwords do not match');
  if (n === o) return toast('New password must be different');
  const btn = $('#pwGo'); btn.disabled = true;
  try {
    const u = auth.currentUser;
    await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, o));
    await updatePassword(u, n);
    $('#pwModal').classList.remove('on');
    toast('Password changed');
  } catch (e) {
    const c = e.code || '';
    toast(c.includes('wrong-password') || c.includes('invalid-credential') ? 'Current password is incorrect' : c.includes('too-many') ? 'Too many attempts. Try later' : 'Could not change password');
  }
  btn.disabled = false;
};
$('#photoIn').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f || !S.user) return;
  try { await setDoc(doc(db, 'users', S.user.uid), { photo: await compressImg(f, 256) }, { merge: true }); }
  catch { toast('Could not save photo'); }
};
applyTheme();
render();
</script>
